name: Publish packages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish new package versions
        run: |
          set -euo pipefail
          published=0

          # Dependency order: each package publishes after the workspace packages that it needs.
          manifests="$(node scripts/publish-order.mjs)"
          while read -r manifest; do
            metadata="$(node -p "((p) => [p.name, p.version].join(' '))(require('./$manifest'))")"
            read -r name local_version <<< "$metadata"

            decision="$(node scripts/publish-decision.mjs "$name" "$local_version")"
            if [ "$decision" = skip ]; then
              continue
            fi

            echo "Publishing $name@$local_version"
            log="$(mktemp)"
            if (cd "${manifest%/package.json}" && npm publish) 2>&1 | tee "$log"; then
              published=1
            elif grep -q 'Cannot publish over previously staged version' "$log"; then
              # npm validates a new version for some minutes, and npm view does not show it yet.
              # An earlier run already published this version, so this run continues.
              echo "::warning::$name@$local_version is still in npm validation from an earlier run; skipped."
            else
              exit 1
            fi
          done <<< "$manifests"

          if [ "$published" = 0 ]; then
            echo 'No new package versions.'
          fi
